<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter - หารค่าข้าวแบบคูลๆ</title>
    <!-- เชื่อมโยงไฟล์ CSS ภายนอก (ห้ามเขียน style ในนี้) -->
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้า Google Fonts เพื่อความสวยงาม -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h2>🍔 Bill Splitter</h2>
        <p class="subtitle">หารค่าข้าว แม่นยำ รวดเร็ว</p>
        
        <form id="billForm">
            <!-- ส่วนกรอกยอดเงินรวม -->
            <div class="input-group">
                <label for="totalBill">ยอดรวมทั้งหมด (บาท)</label>
                <input type="number" id="totalBill" min="0" step="0.01" placeholder="กรอกจำนวนเงิน เช่น 1500" required>
            </div>

            <!-- ส่วนกรอกจำนวนคน -->
            <div class="input-group">
                <label for="peopleCount">จำนวนคน (คน)</label>
                <input type="number" id="peopleCount" min="1" step="1" placeholder="กรอกจำนวนคน เช่น 4" required>
            </div>

            <!-- ส่วนเลือก Service Charge -->
            <div class="input-group">
                <label for="serviceCharge">Service Charge (%)</label>
                <select id="serviceCharge">
                    <option value="0">0% (ไม่มี)</option>
                    <option value="5">5%</option>
                    <option value="10" selected>10% (มาตรฐาน)</option>
                    <option value="15">15%</option>
                </select>
            </div>

            <!-- ปุ่มคำนวณที่ไม่มี onclick เพราะเราจะใช้ addEventListener ใน JS -->
            <button type="submit" id="calculateBtn">คำนวณยอดเงิน</button>
        </form>

        <!-- ส่วนแสดงผลลัพธ์ที่จะถูกเปลี่ยนด้วย JavaScript -->
        <div id="resultContainer" class="result-box hidden">
            <!-- JS จะเอาผลลัพธ์แบบ Template Literal มาใส่ที่นี่ -->
        </div>
    </div>

    <!-- เชื่อมโยงไฟล์ JS ภายนอก ไว้ด้านล่างสุดเพื่อให้ HTML โหลดเสร็จก่อน -->
    <script src="script.js"></script>
</body>
</html>
